<!DOCTYPE html><html lang="zh-Hant"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>債務償還管理</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap');
:root{--bg:#EBEEEC;--surface:#FFFFFF;--alt:#F4F6F5;--ink:#16302B;--muted:#61716B;--faint:#93A099;
 --line:#DCE3E0;--primary:#1E6A5B;--psoft:#E4EFEB;--income:#2E7D5B;--expense:#B84A5A;--gold:#A87C1F}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:76px}
.mono{font-family:'Space Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.top{position:sticky;top:0;z-index:10;background:var(--bg);padding:16px 16px 10px;border-bottom:1px solid var(--line)}
.eyebrow{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:3px;color:var(--faint);text-transform:uppercase}
h1{font-family:'Space Grotesk',sans-serif;font-size:21px;font-weight:700;margin-top:2px}
.gear{position:absolute;right:14px;top:16px;display:flex;gap:6px}
.gear button{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer}
.wrap{padding:14px 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.sec{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:600;margin-bottom:10px}
.stat{display:flex;flex-wrap:wrap;gap:16px}
.stat .b{flex:1;min-width:120px;padding-left:12px;position:relative}
.stat .b i{position:absolute;left:0;top:3px;bottom:3px;width:3px;border-radius:2px}
.stat .b .l{font-size:12px;color:var(--muted);margin-bottom:4px}
.stat .b .v{font-family:'Space Mono',monospace;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.prog{height:8px;border-radius:5px;background:var(--alt);overflow:hidden;margin:12px 0 6px}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,#2FD6A0,#1E6A5B)}
.pt{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.m-row{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line)}
.m-row:last-child{border-bottom:none}
.m-row .pd{width:44px;text-align:center}
.m-row .pd .n{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px}
.m-row .pd .u{font-size:10px;color:var(--faint)}
.m-row .mid{flex:1;min-width:0}
.m-row .mid .mo{font-size:13px;color:var(--muted)}
.m-row .mid .am{font-family:'Space Mono',monospace;font-weight:700;font-size:16px}
.badge{font-size:12px;padding:3px 9px;border-radius:20px;white-space:nowrap}
.badge.wait{background:#FBF0E4;color:#A8701F}
.badge.done{background:var(--psoft);color:var(--primary)}
.cfm{border:none;background:var(--primary);color:#fff;border-radius:9px;padding:9px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.undo{border:none;background:none;color:var(--faint);font-size:11px;cursor:pointer;text-decoration:underline;margin-top:3px}
.done-ts{font-size:11px;color:var(--faint);margin-top:2px}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
input,select{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:15px;background:var(--surface);color:var(--ink)}
.btn{border:none;border-radius:10px;padding:12px;font-size:15px;font-weight:600;cursor:pointer;width:100%}
.btn.pri{background:var(--primary);color:#fff}.btn.ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.alloc-row{display:grid;grid-template-columns:1fr 92px 92px 28px;gap:7px;align-items:center;margin-bottom:8px}
.alloc-row input{padding:8px 9px;font-size:13px}
.alloc-head{font-size:11px;color:var(--faint);display:grid;grid-template-columns:1fr 92px 92px 28px;gap:7px;margin-bottom:6px;padding:0 2px}
.xbtn{border:none;background:none;color:var(--expense);font-size:18px;cursor:pointer}
.hint{font-size:12px;color:var(--muted);line-height:1.6}
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--surface);border-top:1px solid var(--line);z-index:20}
.nav button{flex:1;border:none;background:none;padding:9px 0 11px;font-size:11px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button.on{color:var(--primary)}
.nav .ic{font-size:19px;line-height:1}
.banner{background:#FBF0E4;color:#8A5A12;border:1px solid #EAD6B0;border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.6;margin-bottom:14px}
.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.empty{padding:26px 10px;text-align:center;color:var(--faint);font-size:13px}
/* 借據列印 */
#iou-print{display:none}
@media print{
 body>*{display:none!important}
 #iou-print{display:block!important}
 .iou-copy{page-break-after:always;padding:18mm 16mm;font-family:'Microsoft JhengHei',serif;color:#000}
 .iou-copy:last-child{page-break-after:auto}
}
.iou-copy{color:#000}
.iou-title{text-align:center;font-size:24px;font-weight:700;letter-spacing:8px;margin-bottom:6px}
.iou-tag{text-align:right;font-size:13px;color:#444;margin-bottom:16px}
.iou-body{font-size:16px;line-height:2.4}
.iou-body u{text-underline-offset:5px;padding:0 6px;font-weight:600}
.iou-sign{margin-top:28px;font-size:15px;line-height:2.6}
.iou-acct{margin:14px 0;padding:12px 14px;border:1px solid #999;border-radius:6px;font-size:14px;line-height:1.9;background:#fafafa}
</style></head><body>

<div class="top">
 <div class="eyebrow">DEBT REPAYMENT</div>
 <h1 id="title">債務償還管理</h1>
 <div class="gear">
   <button onclick="regenerate()" title="依設定重算排程">重算</button>
   <button onclick="loadData()" title="重新整理">↻</button>
 </div>
</div>

<div class="wrap" id="view"><div class="empty">載入中…</div></div>

<div class="nav" id="nav"></div>
<div class="toast" id="toast"></div>
<div id="iou-print"></div>

<script>
/* ===================================================================
   ① 貼上你的 Google Apps Script 網頁應用程式網址（結尾 /exec）
   =================================================================== */
const API_URL = "PASTE_YOUR_GAS_WEB_APP_URL_HERE";

let STATE=null, TAB="alloc", ALLOC=[], CODE=sessionStorage.getItem('debt_code')||"";
const NAV=[["alloc","分配","▦"],["brother","哥哥","①"],["sister","姐姐","②"],["iou","借據","✎"]];
const nf=new Intl.NumberFormat('zh-TW',{maximumFractionDigits:0});
const money=n=>'NT$'+nf.format(Math.round(+n||0));
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}
function S(k){return (STATE&&STATE.settings&&STATE.settings[k]!=null)?STATE.settings[k]:'';}

async function api(params){ // GET
 const r=await fetch(API_URL+'?'+new URLSearchParams(Object.assign({code:CODE},params)));return r.json();}
async function post(body){ // POST，不設 Content-Type 以避開 CORS 預檢
 const r=await fetch(API_URL,{method:'POST',body:JSON.stringify(Object.assign({code:CODE},body))});return r.json();}

async function loadData(){
 if(!API_URL||API_URL.indexOf('PASTE_')===0){STATE=null;renderNav();render();return;}
 try{
   let res=await api({action:'get'});
   if(res&&res.locked){ // 需要通關碼
     const c=prompt('請輸入通關碼');
     if(c===null){STATE=null;renderNav();render();return;}
     CODE=c.trim();sessionStorage.setItem('debt_code',CODE);
     res=await api({action:'get'});
     if(res&&res.locked){sessionStorage.removeItem('debt_code');CODE='';toast('通關碼錯誤');STATE=null;renderNav();render();return;}
   }
   STATE=res;ALLOC=(STATE.allocation||[]).slice();
 }catch(e){toast('連線失敗，確認後端網址');STATE=null;}
 renderNav();render();}
async function regenerate(){if(!API_URL||API_URL.indexOf('PASTE_')===0){toast('尚未設定後端網址');return;}
 toast('重算中…');const r=await post({action:'regenerate'});if(r.ok){await loadData();toast('已依設定重算排程');}else toast(r.error||'重算失敗');}

function renderNav(){document.getElementById('nav').innerHTML=NAV.map(n=>
 `<button class="${n[0]===TAB?'on':''}" onclick="go('${n[0]}')"><span class="ic">${n[2]}</span>${n[1]}</button>`).join('');}
function go(t){TAB=t;renderNav();render();window.scrollTo(0,0);}

function render(){const v=document.getElementById('view');
 if(!STATE){v.innerHTML=notReady();return;}
 if(TAB==='alloc')allocView(v);
 else if(TAB==='brother')loanView(v,'brother','哥哥');
 else if(TAB==='sister')loanView(v,'sister','姐姐');
 else iouView(v);}

function notReady(){return `<div class="banner">尚未連上後端。請先依說明建立 Google Sheet＋Apps Script，部署後把網址貼到 index.html 最上方的 <b>API_URL</b>，再重新整理。</div>
 <div class="card hint">設定完成前，以下三頁會是空的。借據頁的欄位可先手動填寫、列印，不需後端。</div>`;}

/* ---- 第1頁：100萬分配（avalanche 高利率優先自動試算）---- */
let ALLOC_OVER={}; // 手動覆寫：{項目:分配金額}
function computeAlloc(){
 const income=+S('進帳金額')||0;
 const debts=(STATE.debts||[]).slice().sort((a,b)=>{
   if(a.order!==b.order)return a.order-b.order;        // 先依你設的償還順序
   const ra=a.rate===''?-1:a.rate, rb=b.rate===''?-1:b.rate;
   return rb-ra;                                        // 同序再依利率高→低
 });
 let pool=income;
 debts.forEach(d=>{
   const bal=+d.remain||0;
   let pay=(d.item in ALLOC_OVER)
     ? Math.min(Math.max(+ALLOC_OVER[d.item]||0,0),bal)   // 手動：不超過欠款
     : Math.min(Math.max(pool,0),bal);                    // 自動：吃剩餘進帳
   d._pay=pay; d._after=bal-pay; d._cleared=(pay>0&&d._after===0); pool-=pay;
 });
 return {income,debts,pool};
}
function allocView(v){
 const debts0=STATE.debts||[];
 if(!debts0.length){v.innerHTML=`<div class="card"><div class="sec">進帳分配</div>
   <div class="empty">「負債」分頁還沒有資料。把負債表的 償還順序／項目／剩餘／年利率／每月應繳 貼進 Google Sheet 的「負債」分頁，再按右上角 ↻。</div></div>`;return;}
 const {income,debts,pool}=computeAlloc();
 const used=income-pool;
 const afterTotal=debts.reduce((s,d)=>s+d._after,0);
 const monthlyNow=debts.reduce((s,d)=>s+(+d.monthly||0),0);
 const monthlySaved=debts.filter(d=>d._cleared).reduce((s,d)=>s+(+d.monthly||0),0);
 v.innerHTML=`<div class="card"><div class="sec">進帳分配</div>
   <div class="stat">
    <div class="b"><i style="background:var(--income)"></i><div class="l">借入進帳</div><div class="v" style="color:var(--income)">${money(income)}</div></div>
    <div class="b"><i style="background:var(--primary)"></i><div class="l">用於清償</div><div class="v">${money(used)}</div></div>
    <div class="b"><i style="background:${pool<0?'var(--expense)':'var(--gold)'}"></i><div class="l">剩餘進帳</div><div class="v" style="color:${pool<0?'var(--expense)':'var(--gold)'}">${money(pool)}</div></div>
   </div>
   <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line)" class="stat">
    <div class="b"><i style="background:var(--expense)"></i><div class="l">清償後剩餘負債</div><div class="v">${money(afterTotal)}</div></div>
    <div class="b"><i style="background:var(--primary)"></i><div class="l">每月至少省下</div><div class="v" style="color:var(--primary)">${money(monthlySaved)}</div></div>
    <div class="b"><i style="background:var(--ink)"></i><div class="l">清償後每月約</div><div class="v">${money(monthlyNow-monthlySaved)}</div></div>
   </div>
   <div class="hint" style="margin-top:10px">每月應繳由 ${money(monthlyNow)} 降到約 ${money(monthlyNow-monthlySaved)}（全清的債務歸零）。<b>部分償還</b>那筆的每月金額可能再降，依銀行重新攤還為準。</div>
  </div>
  <div class="card"><div class="sec">償還順序與分配</div>
   ${debts.map(d=>allocCard(d)).join('')}
   <button class="btn ghost" style="margin-top:6px" onclick="ALLOC_OVER={};render()">重設為自動分配</button>
   <button class="btn pri" style="margin-top:10px" onclick="saveAlloc()">儲存分配到 Sheet</button>
   <div class="hint" style="margin-top:10px">預設依「償還順序」把進帳由高利率往下分配。可手動改每筆「分配」金額，上方數字即時重算。</div>
  </div>`;}
function allocCard(d){
 const tag=d._cleared?'<span class="badge done">全部清償</span>':(d._pay>0?'<span class="badge wait">部分償還</span>':'<span class="badge" style="background:var(--alt);color:var(--faint)">未動用</span>');
 const rate=d.rate===''?'固定/循環':(d.rate*100).toFixed(2)+'%';
 return `<div class="m-row" style="align-items:flex-start">
   <div class="pd"><div class="n">${d.order===9999?'–':d.order}</div><div class="u">順序</div></div>
   <div class="mid">
     <div style="display:flex;justify-content:space-between;align-items:center">
       <div style="font-weight:600;font-size:14px">${esc(d.item)}</div>${tag}</div>
     <div class="mo" style="margin:2px 0 6px">年利率 ${rate}　·　剩餘 ${money(d.remain)}　·　每月 ${money(d.monthly)}</div>
     <div style="display:flex;align-items:center;gap:8px">
       <span style="font-size:12px;color:var(--muted)">本次分配</span>
       <input class="mono" type="number" style="flex:1;padding:7px 9px;font-size:13px" value="${d._pay||''}" placeholder="0"
         oninput="ALLOC_OVER[${JSON.stringify(d.item)}]=+this.value;render()">
       <span style="font-size:12px;color:var(--muted)">→剩 ${money(d._after)}</span>
     </div>
   </div></div>`;}
async function saveAlloc(){if(!API_URL||API_URL.indexOf('PASTE_')===0){toast('尚未設定後端網址');return;}
 const {debts}=computeAlloc();
 const rows=debts.map(d=>({item:d.item,amount:d.remain,alloc:d._pay,note:d._cleared?'全部清償':(d._pay>0?'部分償還':'')}));
 const r=await post({action:'saveAllocation',rows:rows});toast(r.ok?'已儲存分配':'儲存失敗');}

/* ---- 第2、3頁：哥哥 / 姐姐 還款 ---- */
function loanView(v,who,label){
 const rows=(who==='brother'?STATE.brother:STATE.sister)||[];
 const name=S(who==='brother'?'哥哥_姓名':'姐姐_姓名');
 const bank=S(who==='brother'?'哥哥_帳戶_銀行':'姐姐_帳戶_銀行');
 const acct=S(who==='brother'?'哥哥_帳戶_號碼':'姐姐_帳戶_號碼');
 const principal=+S(who==='brother'?'哥哥_本金':'姐姐_本金')||0;
 const rate=+S(who==='brother'?'哥哥_年利率':'姐姐_年利率')||0;
 if(!rows.length){v.innerHTML=`<div class="card"><div class="sec">償還給${label}${name?'（'+esc(name)+'）':''}</div>
   <div class="empty">尚未產生還款排程。到 Google Sheet 的「設定」分頁填好${label}的本金、年利率、期數、起始月後，按右上角「重算」。</div></div>`;return;}
 const total=rows.reduce((s,r)=>s+(+r.amount||0),0);
 const done=rows.filter(r=>r.status==='已收款');
 const paid=done.reduce((s,r)=>s+(+r.amount||0),0);
 const monthly=rows[0].amount;
 v.innerHTML=`<div class="card"><div class="sec">償還給${label}${name?'（'+esc(name)+'）':''}</div>
   <div class="stat">
    <div class="b"><i style="background:var(--ink)"></i><div class="l">本金</div><div class="v">${money(principal)}</div></div>
    <div class="b"><i style="background:var(--gold)"></i><div class="l">年利率</div><div class="v">${(rate*100).toFixed(1)}%</div></div>
    <div class="b"><i style="background:var(--primary)"></i><div class="l">每月</div><div class="v">${money(monthly)}</div></div>
   </div>
   <div class="prog"><i style="width:${total?paid/total*100:0}%"></i></div>
   <div class="pt"><span>已還 ${done.length}/${rows.length} 期</span><span class="mono">${money(paid)} / ${money(total)}</span></div>
   ${(bank||acct)?`<div class="hint" style="margin-top:8px">指定匯款帳戶：${esc(bank)} ${esc(acct)}</div>`:''}
  </div>
  <div class="card"><div class="sec">每月還款</div>
   ${rows.map(r=>paymentRow(who,label,r)).join('')}</div>`;}
function paymentRow(who,label,r){const done=r.status==='已收款';
 return `<div class="m-row">
  <div class="pd"><div class="n">${r.period}</div><div class="u">期</div></div>
  <div class="mid"><div class="mo">${esc(r.month)}</div><div class="am">${money(r.amount)}</div>
   ${done&&r.ts?`<div class="done-ts">✓ ${esc(r.ts)} 確認收款</div>`:''}</div>
  ${done
   ?`<div style="text-align:right"><span class="badge done">已收款</span><br><button class="undo" onclick="unconfirm('${who}',${r.period})">取消</button></div>`
   :`<button class="cfm" onclick="confirmPay('${who}','${label}',${r.period})">確認收款</button>`}
 </div>`;}
async function confirmPay(who,label,period){
 let code='';const need=String(S('通關碼')||'').trim();
 if(need){code=prompt(label+'確認收款｜請輸入通關碼');if(code===null)return;}
 if(!confirm(`確認「${label}」已收到第 ${period} 期款項？`))return;
 const r=await post({action:'confirm',who:who,period:period,code:code});
 if(r.ok){toast('已確認收款');await loadData();}else toast(r.error||'確認失敗');}
async function unconfirm(who,period){if(!confirm('取消這一期的收款確認？'))return;
 const r=await post({action:'unconfirm',who:who,period:period});if(r.ok){toast('已取消');await loadData();}else toast(r.error||'操作失敗');}

/* ---- 借據（一式兩份，可列印）---- */
function iouView(v){
 const g={name:S('哥哥_姓名'),p:S('哥哥_本金'),rate:S('哥哥_年利率'),per:S('哥哥_期數'),st:S('哥哥_起始月'),bank:S('哥哥_帳戶_銀行'),acct:S('哥哥_帳戶_號碼')};
 const s={name:S('姐姐_姓名'),p:S('姐姐_本金'),rate:S('姐姐_年利率'),per:S('姐姐_期數'),st:S('姐姐_起始月'),bank:S('姐姐_帳戶_銀行'),acct:S('姐姐_帳戶_號碼')};
 const borrower=S('借款人')||'';
 const today=new Date();const td=`${today.getFullYear()-1911}/${today.getMonth()+1}/${today.getDate()}`;
 v.innerHTML=`<div class="card"><div class="sec">借款憑據</div>
   <label>選擇出借人（帶入設定資料）</label>
   <select id="i_pick" onchange="fillIou()">
     <option value="">— 請選擇 —</option>
     <option value="g">哥哥${g.name?'（'+esc(g.name)+'）':''}</option>
     <option value="s">姐姐${s.name?'（'+esc(s.name)+'）':''}</option>
   </select>
   <label>出借人（債權人）姓名</label><input id="i_lender" placeholder="例：林大明">
   <label>借款人（債務人）姓名</label><input id="i_borrower" value="${esc(borrower)}">
   <div class="alloc-row" style="grid-template-columns:1fr 1fr">
    <div><label>借款金額（NT$）</label><input id="i_amount" type="number" placeholder="500000"></div>
    <div><label>年利率（%）</label><input id="i_rate" type="number" step="0.1" placeholder="5"></div></div>
   <label>借款日期（民國）</label><input id="i_date" placeholder="例：${td}">
   <label>還款方式</label><input id="i_terms" placeholder="例：自115年12月起，分24期按月攤還，每期22,917元">
   <label>指定還款帳戶（銀行）</label><input id="i_bank" placeholder="例：台新銀行 高雄分行">
   <label>指定還款帳戶（帳號）</label><input id="i_acct" placeholder="例：2001-xxxxxx-xxx">
   <label>立據日期（民國）</label><input id="i_sign" value="${esc(td)}">
   <button class="btn pri" style="margin-top:14px" onclick="printIou()">列印 / 存 PDF（一式兩份）</button>
   <div class="hint" style="margin-top:10px">哥哥、姐姐各列印一式兩份：一份出借人收執、一份借款人收執。姓名、帳號、日期請確認無誤後再列印。</div>
  </div>`;
 window._iou={g,s};}
function fillIou(){const k=document.getElementById('i_pick').value;if(!k)return;const d=window._iou[k];
 const set=(id,val)=>{document.getElementById(id).value=val==null?'':val;};
 set('i_lender',d.name);set('i_amount',d.p);set('i_rate',d.rate?(+d.rate*100):'');
 set('i_bank',d.bank);set('i_acct',d.acct);
 if(d.per&&d.st){const amt=monthlyOf(+d.p,+d.rate,+d.per);
  const ym=String(d.st).split(/[\/\-]/);const roc=(+ym[0])-1911;
  set('i_terms',`自${roc}年${+ym[1]}月起，分${d.per}期按月攤還，每期約 ${nf.format(amt)} 元`);}}
function monthlyOf(p,rate,per){if(!per)return 0;const ti=Math.round(p*rate*(per/12));return Math.round((p+ti)/per);}
function val(id){const e=document.getElementById(id);return e?e.value.trim():'';}
function printIou(){
 const d={lender:val('i_lender'),borrower:val('i_borrower'),amount:+val('i_amount')||0,rate:val('i_rate'),
  date:val('i_date'),terms:val('i_terms'),bank:val('i_bank'),acct:val('i_acct'),sign:val('i_sign')};
 if(!d.lender||!d.borrower||!d.amount){toast('請至少填出借人、借款人、金額');return;}
 const copy=tag=>`<div class="iou-copy">
   <div class="iou-title">借　據</div>
   <div class="iou-tag">（${tag}）</div>
   <div class="iou-body">
    茲向　<u>${esc(d.lender)}</u>（出借人）借到新台幣　<u>${nf.format(d.amount)}</u>　元整，
    約定年利率　<u>${esc(d.rate||'0')}</u>　％。借款日期：民國　<u>${esc(d.date)}</u>。<br>
    還款方式：<u>${esc(d.terms)}</u>，款項匯入下列指定帳戶：
   </div>
   <div class="iou-acct">指定還款帳戶<br>銀行：${esc(d.bank)}　　帳號：${esc(d.acct)}</div>
   <div class="iou-sign">
    此致<br>
    出借人（債權人）：${esc(d.lender)}<br><br>
    立據人（借款人／債務人）：<u>${esc(d.borrower)}</u>　（簽章）<br>
    身分證字號：＿＿＿＿＿＿＿＿＿＿<br>
    聯絡電話：＿＿＿＿＿＿＿＿＿＿<br><br>
    中華民國　<u>${esc(d.sign)}</u>
   </div></div>`;
 document.getElementById('iou-print').innerHTML=copy('出借人收執')+copy('借款人收執');
 window.print();}

renderNav();loadData();
</script></body></html>
